[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rmcompanion"
version = "0.1.0"
description = "Self-hosted companion for reMarkable Paper Pro: continuous cloud sync, dark mode web reader, and MCP server"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "reMarkable Companion Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "rmscene>=0.8.0",
    "pymupdf>=1.25.0",
    "numpy>=2.0.0",
    "mcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
rmcompanion = "rmcompanion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
