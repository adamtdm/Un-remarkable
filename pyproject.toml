[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "un-remarkable"
dynamic = ["version"]
description = "Un-remarkable: Self-hosted companion for reMarkable devices (Paper Pro, RM2, RM1): continuous cloud sync, dark mode web reader, and MCP server"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Adam Meek" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "rmscene>=0.8.0",
    "pymupdf>=1.25.0",
    "numpy>=2.0.0",
    "mcp>=2.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
rmcompanion = "rmcompanion.cli:main"

[tool.setuptools.dynamic]
version = { attr = "rmcompanion.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rmcompanion = ["web/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint]
ignore = ["BLE001", "TRY401", "B008", "E501"]
